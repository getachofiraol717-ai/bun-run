<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a14" />
      <stop offset="50%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    
    <linearGradient id="cyanBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#0077ff" />
    </linearGradient>

    <linearGradient id="purplePink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.6" />
      <stop offset="40%" stop-color="#8b5cf6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="#00f0ff" stroke-width="3" stroke-opacity="0.4" />

  <!-- Ambient Glow -->
  <circle cx="256" cy="256" r="180" fill="url(#centerGlow)" />

  <!-- Orbit Ring 1 -->
  <ellipse cx="256" cy="256" rx="180" ry="65" fill="none" stroke="#00f0ff" stroke-width="2.5" stroke-opacity="0.6" transform="rotate(-30 256 256)" stroke-dasharray="8 6" />
  
  <!-- Orbit Ring 2 -->
  <ellipse cx="256" cy="256" rx="180" ry="65" fill="none" stroke="#a855f7" stroke-width="2.5" stroke-opacity="0.6" transform="rotate(30 256 256)" stroke-dasharray="8 6" />

  <!-- Orbit Ring 3 -->
  <ellipse cx="256" cy="256" rx="190" ry="70" fill="none" stroke="#00d8ff" stroke-width="1.5" stroke-opacity="0.3" transform="rotate(90 256 256)" />

  <!-- Orbiting Electron Particles -->
  <circle cx="110" cy="180" r="7" fill="#00f0ff" filter="url(#glow)" />
  <circle cx="400" cy="330" r="7" fill="#00f0ff" filter="url(#glow)" />
  <circle cx="395" cy="175" r="6" fill="#ec4899" filter="url(#glow)" />
  <circle cx="115" cy="335" r="6" fill="#a855f7" filter="url(#glow)" />

  <!-- Central Holographic Open Book -->
  <!-- Left Page -->
  <path d="M 256 310 C 210 290, 150 290, 110 305 L 110 205 C 150 190, 210 190, 256 210 Z" fill="url(#cyanBlue)" fill-opacity="0.25" stroke="#00f0ff" stroke-width="4" stroke-linejoin="round" filter="url(#softGlow)" />
  
  <!-- Left Page Lines -->
  <line x1="135" y1="228" x2="230" y2="238" stroke="#00f0ff" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.8" />
  <line x1="135" y1="248" x2="230" y2="258" stroke="#00f0ff" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.8" />
  <line x1="135" y1="268" x2="210" y2="278" stroke="#00f0ff" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.8" />

  <!-- Right Page -->
  <path d="M 256 310 C 302 290, 362 290, 402 305 L 402 205 C 362 190, 302 190, 256 210 Z" fill="url(#purplePink)" fill-opacity="0.25" stroke="#c084fc" stroke-width="4" stroke-linejoin="round" filter="url(#softGlow)" />

  <!-- Right Page Lines -->
  <line x1="282" y1="238" x2="377" y2="228" stroke="#c084fc" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.8" />
  <line x1="282" y1="258" x2="377" y2="248" stroke="#c084fc" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.8" />
  <line x1="282" y1="278" x2="357" y2="268" stroke="#c084fc" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.8" />

  <!-- Book Spine / Energy Beam -->
  <line x1="256" y1="205" x2="256" y2="315" stroke="#ffffff" stroke-width="4" stroke-linecap="round" filter="url(#glow)" />

  <!-- Floating Nucleus / Knowledge Crystal above Book -->
  <polygon points="256,120 280,155 256,190 232,155" fill="url(#cyanBlue)" stroke="#ffffff" stroke-width="3" filter="url(#glow)" />
  <circle cx="256" cy="155" r="5" fill="#ffffff" filter="url(#glow)" />

  <!-- Constellation sparks -->
  <circle cx="256" cy="100" r="2.5" fill="#ffffff" />
  <circle cx="230" cy="115" r="2" fill="#00f0ff" />
  <circle cx="282" cy="115" r="2" fill="#ec4899" />
  <line x1="256" y1="100" x2="230" y2="115" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.6" />
  <line x1="256" y1="100" x2="282" y2="115" stroke="#ec4899" stroke-width="1" stroke-opacity="0.6" />

  <!-- KU Modern Typography at bottom -->
  <text x="256" y="420" font-family="'Orbitron', sans-serif, system-ui" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="8" filter="url(#softGlow)">KNOWLEDGE UNIVERSE</text>
  <text x="256" y="450" font-family="'Poppins', sans-serif, system-ui" font-size="14" font-weight="600" fill="#00f0ff" text-anchor="middle" letter-spacing="4">AI LEARNING PLATFORM</text>
</svg>
